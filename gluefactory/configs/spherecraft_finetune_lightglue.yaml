# @package _global_

# This configuration is for FINE-TUNING LightGlue on the SphereCraft dataset.

train:
  epochs: 40  # Fewer epochs are often needed for fine-tuning
  lr: 0.0003 # Use a smaller learning rate for fine-tuning
  optimizer: 'adamw'
  log_every_iter: 100
  eval_every_iter: 1000
  save_every_iter: 1000
  best_key: 'loss/total'
  clip_grad: 1.0
  lr_schedule:
    type: 'warmup_cosine' # Custom type we will implement
    warmup_steps: 1000       # Number of warmup steps
  seed: 42
  keep_last_checkpoints: 5
  load_experiment: "spherecraft_pretrain_lightglue_run3"
  submodules: ['gluefactory.datasets.spherecraft']

  # ========== CURRICULUM LEARNING CONFIG ==========
  curriculum_learning:
    enabled: true
    # Define phases: [start_epoch, end_epoch, bins_to_use]
    phases:
      - name: "Phase1_Easy"
        start_epoch: 0
        end_epoch: 10
        bins: ["easy"]  # Use only easy pairs
        description: "Training on easy pairs only"
      
      - name: "Phase2_Medium" 
        start_epoch: 10
        end_epoch: 20
        bins: ["easy", "medium"]  # Add medium pairs
        description: "Adding medium difficulty pairs"
      
      - name: "Phase3_All"
        start_epoch: 20
        end_epoch: 40
        bins: ["easy", "medium", "hard"]  # All data
        description: "Training on all data"

model:
  name: lightglue
  features: 'xfeat' # Must match the features the model was trained on
  descriptor_dim: 96
  n_layers: 6
  num_heads: 1
  flash: False
  width_confidence: -1
  filter_threshold: 0.1

data:
  name: spherecraft
  data_dir: 'finetuning'
  pair_subdir: 'finetuning_pairs_spherecraft'
  keypoints_detector: 'xfeat'
  train_batch_size: 8
  val_batch_size: 16
  num_workers: 2

  # ========== CURRICULUM LEARNING BINS ==========
  # Paths to bin JSON files (relative to data_dir)
  bin_files:
    easy: 'bin_easy_by_matches.json'
    medium: 'bin_medium_by_matches.json'
    hard: 'bin_hard_by_matches.json'